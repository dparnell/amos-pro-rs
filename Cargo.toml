[workspace]
resolver = "3"
members = ["crates/amos-core", "crates/amos-app", "crates/amos-cli", "crates/amos-build", "crates/amos-compiler", "crates/amos-wasmhost"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
