[package]
name = "amos-wasmhost"
description = "Hosts for compiled AMOS programs (wasmtime natively, the WebAssembly API on the web)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
amos-core = { version = "0.1.0", path = "../amos-core" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmtime = { version = "49.0.1", default-features = false, features = ["cranelift", "runtime", "std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.79"

[dev-dependencies]
amos-compiler = { version = "0.1.0", path = "../amos-compiler" }
wasmparser = "0.260.0"
