[package]
name = "amos-wasmhost"
description = "Native host for compiled AMOS programs (wasmtime)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
amos-core = { version = "0.1.0", path = "../amos-core" }
wasmtime = { version = "49.0.1", default-features = false, features = ["cranelift", "runtime", "std"] }

[dev-dependencies]
amos-compiler = { version = "0.1.0", path = "../amos-compiler" }
wasmparser = "0.260.0"
