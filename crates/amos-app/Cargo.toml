[package]
name = "amos-app"
description = "AMOS Professional for modern platforms (winit + wgpu + cpal, native and wasm)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "amos"
path = "src/main.rs"

[dependencies]
amos-core = { path = "../amos-core" }
amos-wasmhost = { version = "0.1.0", path = "../amos-wasmhost" }
bytemuck = { version = "1.25.2", features = ["derive"] }
cpal = "0.18.2"
log = "0.4.34"
wgpu = { version = "30.0.1", features = ["webgl"] }
winit = "0.30.13"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
amos-build = { version = "0.1.0", path = "../amos-build" }
env_logger = "0.11.11"
pollster = "1.0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
console_log = "1.1.0"
cpal = { version = "0.18.2", features = ["wasm-bindgen"] }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Location"] }
web-time = "1.1.0"
